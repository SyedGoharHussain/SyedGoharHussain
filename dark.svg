<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Syed Gohar Hussain - Full-Stack Developer, Mobile App Developer, Applied AI/CV Engineer">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="typeClipDark">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.35;0.65;0.7;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="300" rx="16" fill="url(#bgGradDark)"/>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="url(#accentGradDark)" stroke-width="2" opacity="0.7"/>

  <!-- floating particles -->
  <circle r="4" fill="#00F0FF" opacity="0.7">
    <animateMotion path="M 800,50 C 850,90 850,150 800,190 C 750,150 750,90 800,50 Z" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#7B2FF7" opacity="0.6">
    <animateMotion path="M 830,120 C 860,150 860,200 830,230 C 800,200 800,150 830,120 Z" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#00F0FF" opacity="0.4">
    <animateMotion path="M 760,180 C 790,210 790,250 760,270 C 730,250 730,210 760,180 Z" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="60" y="120" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="#F0F6FC">
    Syed Gohar Hussain
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- underline -->
  <rect x="60" y="134" width="0" height="4" rx="2" fill="url(#accentGradDark)">
    <animate attributeName="width" values="0;360" dur="1.2s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- typed subtitle -->
  <g clip-path="url(#typeClipDark)">
    <text x="60" y="182" font-family="Consolas, Fira Code, monospace" font-size="22" fill="#58E6FF">
      Full-Stack Dev | Mobile Dev | Applied AI/CV
    </text>
  </g>
  <rect x="608" y="162" width="3" height="26" fill="#58E6FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- skill pills -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="15" font-weight="600">
    <g>
      <rect x="60" y="222" width="92" height="34" rx="17" fill="#161b22" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="106" y="244" fill="#C9D1D9" text-anchor="middle">React</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="164" y="222" width="98" height="34" rx="17" fill="#161b22" stroke="#7B2FF7" stroke-width="1.2"/>
      <text x="213" y="244" fill="#C9D1D9" text-anchor="middle">Flutter</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="274" y="222" width="102" height="34" rx="17" fill="#161b22" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="325" y="244" fill="#C9D1D9" text-anchor="middle">Node.js</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="388" y="222" width="90" height="34" rx="17" fill="#161b22" stroke="#7B2FF7" stroke-width="1.2"/>
      <text x="433" y="244" fill="#C9D1D9" text-anchor="middle">Flask</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="490" y="222" width="122" height="34" rx="17" fill="#161b22" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="551" y="244" fill="#C9D1D9" text-anchor="middle">TensorFlow</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="624" y="222" width="80" height="34" rx="17" fill="#161b22" stroke="#7B2FF7" stroke-width="1.2"/>
      <text x="664" y="244" fill="#C9D1D9" text-anchor="middle">GCP</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
